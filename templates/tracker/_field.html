<div class="form-field{% if field.errors %} has-error{% endif %}{% if wide %} form-field-wide{% endif %}{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
